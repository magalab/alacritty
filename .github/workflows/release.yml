name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install dependencies
        run: brew install scdoc
      - name: Install Apple Silicon target
        run: rustup update && rustup target add aarch64-apple-darwin
      - name: Test
        run: cargo test --release --target=aarch64-apple-darwin
      - name: Make DMG
        run: |
          make dmg-arm64
          mv ./target/release/osx/Alacritty.dmg ./Alacritty-${{ github.ref_name }}.dmg
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            Alacritty-${{ github.ref_name }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-2022
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install x64 target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --release --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare portable executable
        run: cp target/x86_64-pc-windows-msvc/release/alacritty.exe "Alacritty-${GITHUB_REF_NAME}-portable.exe"
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5 WixToolset.Util.wixext/4.0.5
      - name: Create MSI installer
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%[-+]*}"
          wix build -arch x64 -d "ProductVersion=$version" \
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
            -out "Alacritty-${GITHUB_REF_NAME}-installer.msi" \
            alacritty/windows/wix/alacritty.wxs
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            Alacritty-${{ github.ref_name }}-portable.exe
            Alacritty-${{ github.ref_name }}-installer.msi
